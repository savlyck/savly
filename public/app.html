<!doctype html>
<html lang="nb"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10274d"><meta name="description" content="Planlegg middager, bruk maten du har og handle smartere med SAVLY.">
<title>SAVLY · Matplan og handleliste</title><link rel="stylesheet" href="/app.css">
</head><body>
<div class="shell">
<header class="header"><div><span class="brand">SAVLY</span><span class="brand-desc">Middag og handling gjort enkelt</span></div>
<button id="profile-button" aria-label="Åpne profil og innstillinger" type="button"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/></svg></button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<main id="main" tabindex="-1"><p>Åpner planleggeren …</p></main>
<nav id="tabs" aria-label="Hovednavigasjon">
<button data-tab="home" aria-current="page">⌂ <span>Hjem</span></button>
<button data-tab="week">▦ <span>Ukeplan</span></button>
<button data-tab="list">☑ <span>Handleliste</span></button>
<button data-tab="search">⌕ <span>Søk</span></button></nav></div>
<dialog id="profile"><div class="dialog-top"><h2>Profil og innstillinger</h2><button data-action="close-profile" aria-label="Lukk profil">✕</button></div><div id="profile-body"></div></dialog>
<dialog id="editor"><div class="dialog-top"><h2 id="editor-title">Middag</h2><button data-action="close-editor" aria-label="Lukk">✕</button></div><form id="meal-form">
<label>Navn på middag<input id="meal-title" required maxlength="200" autocomplete="off" placeholder="F.eks. taco"></label>
<label>Dag<select id="meal-date"></select></label><label>Antall porsjoner<input id="meal-portions" type="number" min="1" max="30" value="2" required></label>
<label>Ingredienser, én per linje <small>Skriv f.eks. 400 g kjøttdeig. Kan stå tomt.</small><textarea id="meal-ingredients" rows="6" placeholder="400 g kjøttdeig&#10;6 stk tortillalefser"></textarea></label>
<p class="help">Uklare mengder beholdes som tekst. Ingen gjetting.</p>
<button type="submit" class="primary">Lagre middag</button></form></dialog>
<script defer src="/model.js"></script><script defer src="/app.js"></script>
</body></html>
